<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live TV - Dashboard Layanan & Pengawasan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      overflow: hidden;
      background-color: #0b1120;
    }

    /* Progress bar animasi auto-slide */
    .progress-active {
      animation: progress 10s linear forwards;
    }
    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }

    /* Animation Pop-up Card */
    .card-anim {
      opacity: 0;
      transform: translateY(20px) scale(0.96);
      animation: popUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes popUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body class="h-screen w-screen text-slate-100 flex flex-col justify-between p-6 gap-6">

  <!-- HEADER TV -->
  <header class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-2xl backdrop-blur-md">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center border border-blue-400 shadow-lg shadow-blue-500/30 text-2xl">
        📺
      </div>
      <div>
        <h1 class="text-2xl font-black tracking-wide text-white uppercase">REKAPAN LAYANAN & PENGAWASAN</h1>
        <div class="flex items-center gap-2 mt-1">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-lg shadow-emerald-500/50"></span>
          <span class="text-xs font-bold text-emerald-400 tracking-wider uppercase">Siaran Informasi Langsung (Live)</span>
        </div>
      </div>
    </div>

    <!-- CLOCK & STATS -->
    <div class="flex items-center gap-8">
      <div class="text-right border-r border-slate-800 pr-8">
        <span class="text-xs font-extrabold text-slate-400 uppercase tracking-widest block">Total Layanan</span>
        <span class="text-3xl font-black text-amber-400" id="total-count">0</span>
      </div>
      <div class="text-right">
        <span class="text-xs font-extrabold text-slate-400 uppercase tracking-widest block" id="live-date">Memuat...</span>
        <span class="text-4xl font-black text-white tracking-tight font-mono" id="live-time">00:00:00</span>
      </div>
    </div>
  </header>

  <!-- BOARD CONTAINER (CARD GRID 3x2) -->
  <main class="flex-1 relative min-h-0">
    
    <!-- Loading State -->
    <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-slate-950/80 rounded-2xl z-20">
      <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-slate-400 font-bold uppercase tracking-widest">Menyinkronkan Server Apps Script...</p>
    </div>

    <!-- Empty State -->
    <div id="empty" class="hidden absolute inset-0 flex flex-col items-center justify-center gap-2 bg-slate-900/50 border border-slate-800 rounded-2xl">
      <span class="text-6xl opacity-40">📂</span>
      <h2 class="text-xl font-bold text-slate-400 uppercase tracking-wider">Belum Ada Data Rekapan</h2>
    </div>

    <!-- Grid Container (6 Cards Max Per Page) -->
    <div id="card-grid" class="h-full grid grid-cols-3 grid-rows-2 gap-5">
      <!-- Item card akan terisi otomatis dari data Google Apps Script -->
    </div>
  </main>

  <!-- FOOTER TV WITH PROGRESS BAR -->
  <footer class="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
    <div class="w-full bg-slate-800 h-1.5">
      <div id="progress-bar" class="h-full bg-blue-500 shadow-lg shadow-blue-500/80 w-0"></div>
    </div>
    <div class="p-4 flex items-center justify-between text-sm px-6">
      <div class="flex items-center gap-6 font-bold text-slate-400 uppercase text-xs tracking-wider">
        <span>Sistem Informasi TV</span>
        <span>•</span>
        <span class="text-slate-200">Update Otomatis Tiap 5 Menit</span>
      </div>
      <div id="paging-info" class="bg-amber-400 text-slate-950 px-4 py-1.5 rounded-lg font-black text-xs uppercase tracking-wider shadow-md">
        Halaman 1 dari 1
      </div>
    </div>
  </footer>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzriVNdkWu1HikzUlQOtIAurzMeIqLBN-pc5rrN63L0dUlG8ioUzCkVijib24jHc5N7tQ/exec";

    const ITEMS_PER_PAGE = 6;  // 6 item per layar (3 kolom x 2 baris)
    const SLIDE_INTERVAL = 10000; // Berganti halaman tiap 10 detik

    let allRows = [];
    let headers = [];
    let currentPage = 1;
    let totalPages = 1;
    let slideTimer = null;

    // 1. Clock Realtime
    function updateClock() {
      const now = new Date();
      document.getElementById('live-time').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
      document.getElementById('live-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Fetch Data dari GAS
    async function fetchData() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();

        if (data.success && data.rows) {
          headers = data.headers || [];
          allRows = data.rows || [];

          document.getElementById('total-count').innerText = data.count || 0;
          document.getElementById('loading').classList.add('hidden');

          if (allRows.length === 0) {
            document.getElementById('empty').classList.remove('hidden');
            document.getElementById('card-grid').innerHTML = '';
            return;
          }

          document.getElementById('empty').classList.add('hidden');
          totalPages = Math.ceil(allRows.length / ITEMS_PER_PAGE);
          currentPage = 1;

          renderCards();
          startSlideshow();
        }
      } catch (err) {
        console.error("Gagal sinkronisasi data TV:", err);
      }
    }

    // 3. Render Card untuk Layar TV
    function renderCards() {
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageData = allRows.slice(start, end);

      pageData.forEach((item, index) => {
        // Mengambil 2-3 key pertama untuk judul & sub-judul card
        const keys = Object.keys(item);
        const titleKey = keys[0] || 'Layanan';
        const subKey = keys[1] || '';
        
        const titleVal = item[titleKey] || '-';
        const subVal = subKey ? item[subKey] : '';

        // Sisa detail dipasang di bagian isi
        let detailHtml = '';
        keys.slice(2, 5).forEach(k => {
          if (item[k]) {
            detailHtml += `
              <div class="flex justify-between items-center text-xs border-b border-slate-800/60 pb-1.5">
                <span class="text-slate-400 font-semibold uppercase">${k}</span>
                <span class="text-slate-200 font-bold truncate max-w-[60%]">${item[k]}</span>
              </div>
            `;
          }
        });

        const card = document.createElement('div');
        card.className = "card-anim bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between shadow-xl relative overflow-hidden";
        card.style.animationDelay = `${index * 0.08}s`;

        card.innerHTML = `
          <div class="absolute top-0 right-0 bg-blue-600/20 text-blue-400 text-[10px] font-black px-3 py-1 rounded-bl-xl border-l border-b border-blue-500/30 uppercase tracking-widest">
            #${start + index + 1}
          </div>

          <div>
            <span class="text-[10px] font-black text-amber-400 uppercase tracking-widest block mb-1">${titleKey}</span>
            <h3 class="text-xl font-black text-white line-clamp-1 leading-snug">${titleVal}</h3>
            ${subVal ? `<p class="text-sm font-bold text-slate-400 mt-1 line-clamp-1">${subVal}</p>` : ''}
          </div>

          <div class="space-y-2 mt-4 bg-slate-950/50 p-3 rounded-xl border border-slate-800/80">
            ${detailHtml || '<p class="text-xs text-slate-500 italic">Tidak ada detail tambahan</p>'}
          </div>
        `;

        grid.appendChild(card);
      });

      document.getElementById('paging-info').innerText = `Halaman ${currentPage} dari ${totalPages}`;
      resetProgressBar();
    }

    // 4. Otomatisasi Slide Halaman TV
    function startSlideshow() {
      clearInterval(slideTimer);
      if (totalPages <= 1) {
        document.getElementById('progress-bar').style.width = '100%';
        return;
      }

      slideTimer = setInterval(() => {
        currentPage = currentPage >= totalPages ? 1 : currentPage + 1;
        renderCards();
      }, SLIDE_INTERVAL);
    }

    function resetProgressBar() {
      const pb = document.getElementById('progress-bar');
      pb.classList.remove('progress-active');
      void pb.offsetWidth; // Trigger reflow
      if (totalPages > 1) {
        pb.classList.add('progress-active');
      }
    }

    // Load data awal & auto-refresh tiap 5 menit
    fetchData();
    setInterval(fetchData, 300000);
  </script>
</body>
</html>
